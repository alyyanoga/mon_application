<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <link rel="manifest" href="manifest.json">

<meta name="theme-color"
      content="#2563eb">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#2563eb">

    <title>Tableau de bord</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- En-tête -->
    <header class="topbar">

        <div class="logo">
            MON APPLICATION
        </div>

        <div class="user-info">
            👤 <span id="username">Admin</span>
        </div>

    </header>


    <!-- Contenu principal -->
    <main class="container">

        <h1>Tableau de bord</h1>

        <p class="welcome">
            Bienvenue dans votre espace de gestion.
        </p>


        <!-- Cartes statistiques -->
        <section class="cards">

            <div class="card">

                <div class="card-icon">
                    📦
                </div>

                <div>
                    <h3>Produits</h3>
                    <p>125</p>
                </div>

            </div>


            <div class="card">

                <div class="card-icon">
                    💰
                </div>

                <div>
                    <h3>Ventes</h3>
                    <p>350</p>
                </div>

            </div>


            <div class="card">

                <div class="card-icon">
                    👥
                </div>

                <div>
                    <h3>Clients</h3>
                    <p>42</p>
                </div>

            </div>


            <div class="card">

                <div class="card-icon">
                    💵
                </div>

                <div>
                    <h3>Chiffre d'affaires</h3>
                    <p>1 250 000</p>
                </div>

            </div>

        </section>


        <!-- Menu -->
        <section class="menu">

            <button onclick="ouvrirPage('produits')">
                📦
                <span>Produits</span>
            </button>

            <button onclick="ouvrirPage('ventes')">
                🛒
                <span>Ventes</span>
            </button>

            <button onclick="ouvrirPage('clients')">
                👥
                <span>Clients</span>
            </button>

            <button onclick="ouvrirPage('rapports')">
                📊
                <span>Rapports</span>
            </button>

        </section>


        <!-- Déconnexion -->
        <button id="logout"
                class="logout-button">

            🚪 Se déconnecter

        </button>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
